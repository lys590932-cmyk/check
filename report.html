<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5f4e">
<link rel="manifest" href="manifest.webmanifest">
<title>تقرير تشييك — سفن ايكونز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .ring{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
  .meta div{background:var(--surface-2);border-radius:4px;padding:8px 10px}
  .meta .k{font-size:10.5px;color:var(--ink-3)}
  .meta .v{font-size:13px;font-weight:600}
  .it{padding:9px 0;border-bottom:1px dashed var(--rule-2);display:flex;gap:9px;align-items:flex-start}
  .it:last-child{border-bottom:0}
  .it .st{flex:0 0 74px}
  .it .bd{flex:1;min-width:0}
  .it .bd b{font-size:13.5px}
  .it .bd p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
  .shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .shots img{width:150px;border-radius:4px;border:1px solid var(--rule)}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
  .sign div{border-top:1px solid var(--rule);padding-top:6px;font-size:12px;color:var(--ink-3)}
  @media print{ .shots img{width:120px} }
</style>
</head>
<body>

<header class="top noprint">
  <div class="in">
    <div class="brand"><div class="n" id="coName">سفن ايكونز</div><h1>تقرير تشييك</h1></div>
    <div style="display:flex;gap:7px">
      <button class="btn g sm" onclick="history.length>1?history.back():location.href='index.html'">رجوع</button>
      <button class="btn g sm" onclick="window.print()">طباعة / PDF</button>
      <button class="btn p sm" id="shareBtn">مشاركة</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="view"><div class="card"><h2>جارٍ التحميل…</h2></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script src="report.js"></script>
</body>
</html>
