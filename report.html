<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5f4e">
<link rel="manifest" href="manifest.webmanifest">
<title>تقرير تشييك — سفن ايكونز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .ring{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
  .meta div{background:var(--surface-2);border-radius:4px;padding:8px 10px}
  .meta .k{font-size:10.5px;color:var(--ink-3)}
  .meta .v{font-size:13px;font-weight:600}
  .it{padding:9px 0;border-bottom:1px dashed var(--rule-2);display:flex;gap:9px;align-items:flex-start}
  .it:last-child{border-bottom:0}
  .it .st{flex:0 0 74px}
  .it .bd{flex:1;min-width:0}
  .it .bd b{font-size:13.5px}
  .it .bd p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
  .shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .shots img{width:150px;border-radius:4px;border:1px solid var(--rule)}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
  .sign div{border-top:1px solid var(--rule);padding-top:6px;font-size:12px;color:var(--ink-3)}
  @media print{ .shots img{width:120px} }

  /* مسرح بناء الـPDF — خارج الشاشة تماماً */
  #pdfstage{position:fixed;inset-inline-start:-99999px;top:0;width:794px;
    background:#fff;z-index:-1;pointer-events:none}

  /* طبقة الانتظار */
  #pdfwait{position:fixed;inset:0;z-index:200;display:flex;align-items:center;
    justify-content:center;background:rgba(8,20,17,.62);backdrop-filter:blur(3px)}
  #pdfwait.hide{display:none}
  #pdfwait .box{background:var(--surface);border-radius:16px;padding:26px 30px;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);min-width:230px}
  #pdfwait .spin{width:38px;height:38px;margin:0 auto 13px;border-radius:50%;
    border:3px solid var(--rule-2);border-top-color:var(--accent);
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #pdfwait .t{font-weight:800;font-size:14.5px}
  #pdfwait .s{font-size:12px;color:var(--ink-3);margin-top:4px}
  #pdfwait .pbar{height:5px;border-radius:99px;background:var(--rule-2);
    margin:13px 0 4px;overflow:hidden}
  #pdfwait .pbar i{display:block;height:100%;width:0;border-radius:99px;
    background:var(--accent);transition:width .3s ease}
  #pdfCancel{margin-top:12px;background:none;border:0;color:var(--ink-3);
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    text-decoration:underline;padding:6px 10px}

  /* الوضع العام: الزائر يرى التقرير فقط — لا أزرار إدارة ولا تنقّل */
  body.pubview .staffonly{display:none !important}
  .pubnote{display:flex;align-items:center;gap:9px;background:var(--surface-2);
    border:1px solid var(--rule-2);border-radius:12px;padding:10px 13px;
    margin-bottom:12px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
  .pubnote b{color:var(--ink-2)}

  /* لوحة «جاهز للمشاركة» — زرها هو اللمسة التي يقبلها النظام */
  .rdy{position:fixed;inset-inline:0;bottom:0;z-index:150;
    padding:13px 14px calc(13px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--rule-2);
    box-shadow:0 -10px 34px rgba(13,26,23,.16);
    animation:rdyUp .32s cubic-bezier(.32,.72,0,1) both}
  @keyframes rdyUp{from{transform:translateY(100%)}to{transform:none}}
  .rdy-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .rdy-ic{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--ok);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}
  .rdy-t{flex:1;min-width:140px;font-size:14px;font-weight:800;line-height:1.4}
  .rdy-t small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);margin-top:2px}
  .rdy .btn{flex:0 0 auto;padding:12px 20px;border-radius:10px;font-size:14px;min-height:46px}
  .rdy .btn.g{padding:12px 15px}
  @media (max-width:420px){ .rdy .btn.p{flex:1} }

  /* ── عارض الصور بالتكبير ── */
  .zv{position:fixed;inset:0;z-index:200;background:#05100e;display:flex;
    flex-direction:column;touch-action:none;animation:zvIn .2s ease}
  @keyframes zvIn{from{opacity:0}to{opacity:1}}
  .zv-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
  .zv-cnt{flex:1;font-size:13px;opacity:.85;direction:ltr}
  .zv-cap{font-size:12.5px;opacity:.95;font-weight:700;max-width:62%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zv-x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);
    color:#fff;font-size:20px;cursor:pointer;flex:0 0 auto}
  .zv-stage{flex:1;position:relative;overflow:hidden;display:flex;
    align-items:center;justify-content:center}
  .zv-stage img{max-width:100%;max-height:100%;object-fit:contain;
    transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
  .zv-stage img.anim{transition:transform .22s cubic-bezier(.32,.72,0,1)}
  .zv-tools{flex:0 0 auto;display:flex;justify-content:center;gap:8px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
  .zv-tools button{min-width:48px;height:44px;border-radius:12px;border:0;
    background:rgba(255,255,255,.15);color:#fff;font-family:inherit;font-size:17px;
    font-weight:800;cursor:pointer}
  .zv-tools button:disabled{opacity:.28}
  .zv-tools button:active{background:rgba(255,255,255,.3)}
  .zv-hint{position:absolute;inset-inline:0;bottom:14px;text-align:center;color:#fff;
    font-size:11.5px;opacity:.55;pointer-events:none}
</style>
</head>
<body>

<header class="top noprint">
  <div class="in">
    <div class="brand"><div class="n" id="coName">سفن ايكونز</div><h1>تقرير تشييك</h1></div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn g sm staffonly" onclick="history.length>1?history.back():location.href='index.html'">رجوع</button>
      <button class="btn g sm" onclick="window.print()">طباعة</button>
      <button class="btn g sm staffonly" id="shareTxtBtn">نص</button>
      <button class="btn g sm" id="sharePdfBtn">📄 PDF</button>
      <button class="btn g sm staffonly" id="shareLinkBtn">🔗 رابط</button>
      <button class="btn p sm" id="shareAllBtn">مشاركة التقرير</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="view"><div class="card"><h2>جارٍ التحميل…</h2></div></div>
</main>

<!-- مستند A4 يُبنى خارج الشاشة ثم يُحوَّل PDF. لا يظهر للمستخدم أبداً. -->
<div id="pdfstage" aria-hidden="true"></div>

<!-- طبقة الانتظار أثناء توليد الـPDF -->
<div id="pdfwait" class="hide">
  <div class="box"><div class="spin"></div>
    <div class="t">جارٍ تجهيز التقرير…</div>
    <div class="s" id="pdfStep">تحميل الصور</div>
    <div class="pbar"><i id="pdfBar"></i></div>
    <button id="pdfCancel">إلغاء</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script src="report.js"></script>
</body>
</html>
