<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B5F4E">
<title>سفن ايكونز — الصيانة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --brand:#0B5F4E; --brand-dark:#063B30;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --surface:#fff; --surface-1:#f8fafc; --surface-2:#f1f5f9;
  --rule:#e2e8f0; --rule-2:#cbd5e1;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--surface-2);
  color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%}
html[dir="ltr"] body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:100%}
.hide{display:none!important}
h1,h2,h3{font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;margin:0}

/* ── الدخول ── */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(155deg,var(--brand-dark),var(--brand))}
.gc{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:390px;
  box-shadow:0 24px 64px rgba(0,0,0,.28);text-align:center}
.gc img{width:104px;margin-bottom:4px}
.gc h1{font-size:19px;margin:8px 0 3px}
.gc .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:20px}
.fld{text-align:start;margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1px solid var(--rule);
  border-radius:10px;font-size:14.5px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(11,95,78,.12)}
.b-main{width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font-weight:700;font-size:15px;cursor:pointer}
.b-main:disabled{opacity:.6;cursor:default}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:10px;
  font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.7;text-align:start}
.lang-sw{background:none;border:1px solid var(--rule);border-radius:99px;padding:5px 13px;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2);margin-bottom:14px}

/* ── الهيكل ── */
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;
  padding:calc(9px + env(safe-area-inset-top)) 13px 9px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:9px}
.top h2{font-size:15px;font-weight:700}
.top .who{font-size:10.5px;opacity:.82;margin-top:1px}
.top .ib{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:9px;
  min-width:34px;height:34px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer}
nav.tabs{background:var(--brand-dark);position:sticky;top:0;z-index:19;overflow-x:auto}
nav.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;padding:0 6px}
.tb{background:none;border:0;color:rgba(255,255,255,.7);padding:11px 13px;font-size:12.5px;
  font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tb.on{color:#fff;border-bottom-color:#fff}
.tb .n{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;
  margin-inline-start:4px;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:13px 11px 40px}
.view{display:none}.view.on{display:block}

/* ── مكوّنات ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:9px;margin-bottom:13px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;
  border-inline-start:4px solid var(--c,var(--brand))}
.kpi .l{font-size:11px;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;color:var(--c,var(--brand));
  font-variant-numeric:tabular-nums}
.kpi .s{font-size:10.5px;color:var(--ink-3);margin-top:1px}

.card{background:var(--surface);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.card-h{padding:11px 14px;border-bottom:1px solid var(--rule);font-weight:700;font-size:13.5px;
  display:flex;align-items:center;gap:7px}
.card-h .sp{margin-inline-start:auto;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.card-b{padding:13px 14px}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.bar input,.bar select{padding:9px 11px;border:1px solid var(--rule);border-radius:9px;
  font-size:12.5px;background:#fff}
.btn{padding:9px 14px;border:0;border-radius:9px;font-weight:600;font-size:12.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.p{background:var(--brand);color:#fff}
.btn.g{background:#fff;color:var(--brand);border:1px solid var(--rule-2)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn-lg{padding:14px 18px;font-size:14px;border-radius:12px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--surface-1);text-align:start;padding:9px 10px;font-size:11px;color:var(--ink-3);
  font-weight:600;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--surface-1)}
.empty{text-align:center;color:var(--ink-3);padding:28px 14px;font-size:13px}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:700;
  white-space:nowrap}
.pill.g{background:#dcfce7;color:#14532d} .pill.r{background:#fee2e2;color:#7f1d1d}
.pill.a{background:#fef3c7;color:#78350f} .pill.b{background:#dbeafe;color:#1e3a8a}
.pill.n{background:var(--surface-2);color:var(--ink-2)}
.pill.p{background:#f3e8ff;color:#581c87}

/* شريط المهلة */
.sla{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.sla i{display:block;height:100%;border-radius:99px;transition:width .4s}

/* بطاقة تذكرة — بديل الجدول على الموبايل */
.tk{background:var(--surface-1);border-radius:11px;padding:11px 12px;margin-bottom:8px;
  cursor:pointer;border-inline-start:4px solid var(--rule-2)}
.tk:last-child{margin-bottom:0}
.tk:hover{background:var(--surface-2)}
.tk-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.tk-no{font-size:11px;color:var(--ink-3);font-weight:700}
.tk-title{font-size:13.5px;font-weight:600;line-height:1.5}
.tk-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:4px}
.tk-meta span{display:inline-flex;align-items:center;gap:3px}
.tk-meta i{font-size:13px}

.esc0{border-inline-start:4px solid var(--rule-2)}
.esc1{border-inline-start:4px solid var(--warn)}
.esc2{border-inline-start:4px solid var(--bad)}
.esc3{border-inline-start:4px solid var(--bad);background:#fff5f5}

.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:580px;border-radius:20px 20px 0 0;max-height:93vh;
  display:flex;flex-direction:column}
@media(min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px}
.sheet-h h3{font-size:15px;flex:1}
.sheet-x{background:var(--surface-2);border:0;width:32px;height:32px;border-radius:9px;
  font-size:19px;cursor:pointer;color:var(--ink-2)}
.sheet-b{padding:14px 16px;overflow-y:auto;flex:1}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);
  display:flex;gap:8px}
.sheet-f .btn{flex:1;justify-content:center;padding:13px}

.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;
  padding:11px 13px;font-size:12px;line-height:1.75;margin-bottom:12px}
.note.w{background:#fffbeb;border-color:#fde68a;color:#92400e}
.note.d{background:#fef2f2;border-color:#fecaca;color:#991b1b}

.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(120px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;
  font-weight:600;z-index:200;transition:transform .32s;max-width:90%;text-align:center}
html[dir="rtl"] .toast{transform:translateX(50%) translateY(120px)}
.toast.on{transform:translateX(-50%) translateY(0)}
html[dir="rtl"] .toast.on{transform:translateX(50%) translateY(0)}
.toast.bad{background:var(--bad)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* شبكة الفئات */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.cat{background:var(--surface-1);border:1.5px solid var(--rule);border-radius:12px;
  padding:13px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:6px}
.cat.on{border-color:var(--brand);background:rgba(11,95,78,.07)}
.cat i{font-size:23px;color:var(--brand)}
.cat span{font-size:11.5px;font-weight:600;line-height:1.35}

.prios{display:flex;gap:7px;flex-wrap:wrap}
.prio{flex:1;min-width:96px;border:1.5px solid var(--rule);border-radius:11px;padding:10px 7px;
  cursor:pointer;text-align:center;background:#fff}
.prio.on{border-width:2px}
.prio b{display:block;font-size:12.5px}
.prio small{font-size:10px;color:var(--ink-3)}

.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.shot{aspect-ratio:1;border:2px dashed var(--rule-2);border-radius:11px;display:flex;
  align-items:center;justify-content:center;overflow:hidden;background:var(--surface-1);
  cursor:pointer;position:relative}
.shot img{width:100%;height:100%;object-fit:cover}
.shot i{font-size:24px;color:var(--ink-3)}
.shot .x{position:absolute;top:3px;inset-inline-end:3px;background:rgba(0,0,0,.6);color:#fff;
  width:22px;height:22px;border-radius:50%;font-size:14px;display:flex;align-items:center;
  justify-content:center}

.tl{position:relative;padding-inline-start:20px}
.tl::before{content:'';position:absolute;inset-inline-start:5px;top:6px;bottom:6px;
  width:2px;background:var(--rule)}
.tl-i{position:relative;padding-bottom:13px}
.tl-i::before{content:'';position:absolute;inset-inline-start:-19px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--rule)}
.tl-i .w{font-size:12.5px;font-weight:600}
.tl-i .m{font-size:10.5px;color:var(--ink-3);margin-top:1px}

.rowline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.rowline:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:flex;align-items:center;gap:9px;font-size:12px}
.barrow .nm{width:120px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .tr{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--brand);border-radius:99px}
.barrow .vl{width:82px;text-align:end;font-weight:700;flex:0 0 auto}
</style>
</head>
<body>

<!-- ══════════ الدخول ══════════ -->
<div id="gate">
  <div class="gc">
    <button class="lang-sw" onclick="toggleLang()" id="gLang">English</button>
    <img src="logo-sevenicons.png" alt="" onerror="this.style.display='none'">
    <h1 data-t="app_title">نظام الصيانة</h1>
    <div class="sub" data-t="company">سفن ايكونز</div>
    <div id="gErr" class="err hide"></div>
    <div class="fld"><label data-t="email">البريد الإلكتروني</label>
      <input id="gEmail" type="email" inputmode="email" autocomplete="username"
             autocapitalize="off" spellcheck="false" dir="ltr"></div>
    <div class="fld"><label data-t="password">كلمة المرور</label>
      <input id="gPass" type="password" autocomplete="current-password" dir="ltr"></div>
    <button class="b-main" id="gBtn" onclick="doLogin()" data-t="signin">دخول</button>
  </div>
</div>

<!-- ══════════ التطبيق ══════════ -->
<div id="app" class="hide">
<header class="top"><div class="top-in">
  <div class="grow">
    <h2 data-t="app_title">نظام الصيانة</h2>
    <div class="who" id="who">—</div>
  </div>
  <button class="ib" onclick="toggleLang()" id="tLang">EN</button>
  <button class="ib" onclick="refreshAll()" title="تحديث"><i class="ti ti-refresh"></i></button>
  <button class="ib" onclick="doLogout()"><i class="ti ti-logout"></i></button>
</div></header>

<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-tickets"></section>
  <section class="view" id="v-assets"></section>
  <section class="view" id="v-intel"></section>
  <section class="view" id="v-setup"></section>
</main>
</div>

<div id="sheetHost"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=1.9.1"></script>
<!-- lib.js يعرّف window.SI (عميل Supabase، الكاميرا، الرفع، الطابور).
     بدونه maint.js يقع من أول سطر ولا يُعرَّف أي زر — والشاشة تبدو
     سليمة تماماً وهي ميتة. لا تحذفه. -->
<script src="lib.js?v=1.9.1"></script>
<script src="maint.js?v=1.9.1"></script>
</body>
</html>
